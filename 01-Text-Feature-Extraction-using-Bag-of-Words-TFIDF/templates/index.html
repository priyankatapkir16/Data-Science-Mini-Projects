<!DOCTYPE html>
<html>
<head>
    <title>Mini NLP Vectorizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        .output-box {
            background: #f0f0f0;
            padding: 15px;
            margin-top: 15px;
            word-break: break-word;
        }
    </style>
</head>
<body>

<h2>Mini Project: Bag-of-Words & TF-IDF Vectorizer</h2>

<form method="POST">
    <textarea name="input_text" placeholder="Enter your text...">{{ input_text }}</textarea>
    <br>
    <button type="submit">Generate Vectors</button>
</form>


{% if bow and tfidf %}
<div class="output-box">
    <h3>Bag-of-Words Vector:</h3>
    <pre>{{ bow }}</pre>

    <h3>TF-IDF Vector:</h3>
    <pre>{{ tfidf }}</pre>
</div>
{% endif %}

</body>
</html>
