<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Classifier</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="card glass-card">
    <h1>Fruit Classifier</h1>
    <p class="subtitle">Enter fruit details to predict type & visualize the tree</p>

    <form method="POST">
        <label>Weight (grams)</label>
        <input type="number" step="0.1" name="weight" value="{{ weight }}" placeholder="Enter weight" required>

        <label>Color</label>
        <select name="color" required>
            <option value="0" {% if color=='0' %}selected{% endif %}>Red</option>
            <option value="1" {% if color=='1' %}selected{% endif %}>Orange</option>
            <option value="2" {% if color=='2' %}selected{% endif %}>Yellow</option>
        </select>


        <label>Diameter (cm)</label>
        <input type="number" step="0.1" name="diameter" value="{{ diameter }}" placeholder="Enter diameter" required>

        <button type="submit">Predict Fruit</button>
    </form>

    {% if result %}
    <div class="result-box">
        <h3>Prediction Result</h3>
        <p>{{ result }}</p>
    </div>
    {% endif %}

    <div class="tree-box">
        <h3>Decision Tree Visualization</h3>
        <img src="{{ url_for('static', filename='tree.png') }}" alt="Decision Tree">
    </div>
</div>

</body>
</html>
